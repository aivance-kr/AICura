name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 같은 브랜치에서 새 푸시가 오면 진행 중 실행을 취소
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 최소권한 — changes 잡의 paths-filter 가 PR 변경 파일을 API 로 조회하려면
# pull-requests:read 가 필요하다. 그 외 잡은 checkout(contents:read)만 사용한다.
permissions:
  contents: read
  pull-requests: read

jobs:
  # ───────────────────────────── 변경 영역 감지 ─────────────────────────────
  # 이번 push/PR 에서 실제로 바뀐 경로를 판별해 관련 잡만 실행한다.
  # (문서 전용 → 둘 다 skip / 백엔드만 → app skip / 앱만 → backend skip)
  changes:
    name: 변경 영역 감지
    runs-on: [self-hosted, Linux, X64, docker]
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'app/**'
              - 'tests/**'
              - 'public/**'
              - 'composer.json'
              - 'composer.lock'
              - 'phpstan.neon'
              - 'phpunit.dist.xml'
              - 'rector.php'
              - '.php-cs-fixer.dist.php'
              - 'env'
              - 'spark'
              - '.github/workflows/ci.yml'
            app:
              - 'app-mobile/**'
              - '.github/workflows/ci.yml'

  # ───────────────────────────── 백엔드 (CodeIgniter 4) ─────────────────────────────
  backend:
    name: Backend (PHP 8.5 · PHPStan · PHPUnit)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: [self-hosted, Linux, X64, docker]
    # MySQL 은 docker run 으로 직접 띄운다. 러너가 도커 컨테이너라 services: 가 호스트에
    # 게시한 포트(127.0.0.1)에는 닿지 못한다("Connection refused"). 실행별 전용 네트워크에
    # 러너와 MySQL 을 같이 붙이고 컨테이너 이름으로 접속한다.
    env:
      MYSQL_CONTAINER: aicura-ci-mysql-${{ github.run_id }}
      MYSQL_NETWORK: aicura-ci-net-${{ github.run_id }}

    steps:
      - uses: actions/checkout@v4

      - name: MySQL 컨테이너 기동
        run: |
          docker rm -f -v "$MYSQL_CONTAINER" >/dev/null 2>&1 || true
          docker network create "$MYSQL_NETWORK"
          docker network connect "$MYSQL_NETWORK" "$(hostname)"
          docker run -d --name "$MYSQL_CONTAINER" \
            --network "$MYSQL_NETWORK" \
            -e MYSQL_DATABASE=aicura \
            -e MYSQL_USER=aicura \
            -e MYSQL_PASSWORD='Aicura@2026!Dev' \
            -e MYSQL_ROOT_PASSWORD=root \
            --tmpfs /var/lib/mysql \
            mysql:8.0 \
            --innodb-flush-log-at-trx-commit=0 \
            --innodb-flush-method=nosync \
            --sync-binlog=0 \
            --innodb-redo-log-capacity=536870912
          # 초기화 중 임시 서버 단계의 ping 성공을 넘기려고 실제 인증 쿼리로 대기한다.
          ready=0
          for i in $(seq 1 60); do
            docker exec "$MYSQL_CONTAINER" mysql -uroot -proot -e "SELECT 1" aicura >/dev/null 2>&1 && { ready=1; break; }
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            echo "::error::MySQL 이 60초 안에 준비되지 않았습니다"
            docker logs "$MYSQL_CONTAINER" 2>&1 | tail -20
            exit 1
          fi

      - name: PHP 8.4+ 보장 (러너 이미지 편차 대응)
        run: |
          APT="sudo apt-get -o DPkg::Lock::Timeout=300"
          php_ok() { command -v php >/dev/null && php -r 'exit(version_compare(PHP_VERSION, "8.4", ">=") ? 0 : 1);'; }
          # 조직 러너 이미지가 제각각이다 — ondrej PPA 가 붙은 러너는 php-cli 가 8.5 지만,
          # 네이티브 Ubuntu 24.04 러너(runner-03)는 8.3.6 이라 composer.json 요구를 못 채워
          # composer install 이 실패했다. 8.4 미만이면 PPA 로 8.5 를 설치해 기본 php 로 지정한다.
          # (Ubuntu 26.04 러너는 네이티브가 8.5 라 이 분기를 타지 않는다.)
          if ! php_ok; then
            $APT update -qq
            command -v php >/dev/null || $APT install -y --no-install-recommends php-cli
            if ! php_ok; then
              $APT install -y --no-install-recommends software-properties-common
              sudo add-apt-repository -y ppa:ondrej/php
              $APT update -qq
              $APT install -y --no-install-recommends php8.5-cli
              sudo update-alternatives --set php /usr/bin/php8.5
            fi
          fi
          # 확장은 지금 PATH 의 php 버전에 맞춰 버전 명시 패키지로, 없는 것만 설치한다
          # (버전 없는 php-intl 등은 다른 버전을 끌어와 쓰는 php 에 안 붙을 수 있다).
          V="$(php -r 'echo PHP_MAJOR_VERSION . "." . PHP_MINOR_VERSION;')"
          MISSING=""
          for item in mbstring:mbstring intl:intl mysql:mysqli xml:dom curl:curl zip:zip sqlite3:sqlite3; do
            php -m | grep -qix "${item#*:}" || MISSING="$MISSING php${V}-${item%%:*}"
          done
          # 커버리지 드라이버(pcov/xdebug)가 없으면 phpunit 이 경고 → failOnWarning 으로 실패한다.
          php -m | grep -qiE '^(pcov|xdebug)$' || MISSING="$MISSING php${V}-xdebug"
          if [ -n "$MISSING" ]; then
            echo "설치 필요:$MISSING"
            $APT update -qq
            $APT install -y --no-install-recommends $MISSING
          fi
          command -v composer >/dev/null || $APT install -y --no-install-recommends composer
          php -v
          composer --version

      - name: Composer 캐시
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock', 'composer.json') }}
          restore-keys: composer-

      - name: 의존성 설치
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: .env 준비
        run: |
          cp env .env
          {
            echo "app.baseURL = http://localhost:8300/"
            echo "JWT_SECRET = ci-test-secret-key-please-change-32chars-min"
            echo "database.default.hostname = ${MYSQL_CONTAINER}"
            echo "database.default.port = 3306"
            echo "database.default.database = aicura"
            echo "database.default.username = aicura"
            echo "database.default.password = Aicura@2026!Dev"
            echo "database.default.DBDriver = MySQLi"
          } >> .env

      - name: writable 디렉토리 준비 (git 미추적 — CI4 WRITEPATH 보장)
        run: |
          mkdir -p writable/cache writable/logs writable/logs/raw \
                   writable/session writable/uploads writable/debugbar
          chmod -R 777 writable

      - name: 코드 스타일 검사 (PHP CS Fixer)
        # dry-run — 포맷이 어긋난 파일이 있으면 실패(자동 수정 안 함).
        # 수정은 로컬에서 `composer cs:fix` 로 처리한다.
        run: composer cs

      - name: 정적 분석 (PHPStan)
        run: composer analyse

      - name: 테스트 DB 연결 정보 보정 (localhost → MySQL 컨테이너 이름)
        # Linux 러너의 GNU sed 문법. -i 뒤에 백업 확장자를 붙이지 않는다(BSD sed와 다름).
        run: |
          sed -i \
            -e "s#name=\"database.tests.hostname\" value=\"localhost\"#name=\"database.tests.hostname\" value=\"${MYSQL_CONTAINER}\"#" \
            phpunit.dist.xml

      - name: 단위·DB 테스트 (PHPUnit)
        env:
          # xdebug 는 기본 모드가 off — 명시하지 않으면 커버리지 드라이버 없음 경고로 실패한다.
          XDEBUG_MODE: coverage
        run: composer test

      - name: 컨테이너 정리
        if: always()
        run: |
          docker rm -f -v "$MYSQL_CONTAINER" >/dev/null 2>&1 || true
          docker network disconnect -f "$MYSQL_NETWORK" "$(hostname)" >/dev/null 2>&1 || true
          docker network rm "$MYSQL_NETWORK" >/dev/null 2>&1 || true

  # ───────────────────────────── 앱 (Flutter) ─────────────────────────────
  app:
    name: App (Flutter · analyze · test)
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: [self-hosted, Linux, X64, docker]
    defaults:
      run:
        working-directory: app-mobile

    steps:
      - uses: actions/checkout@v4

      - name: Flutter 설정
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 의존성 설치
        run: flutter pub get

      - name: 포맷 검사
        run: dart format --output=none --set-exit-if-changed lib test

      - name: 정적 분석
        run: flutter analyze

      - name: 테스트
        run: flutter test

  # ───────────────────────────── Slack 알림 (CI 실패 시) ─────────────────────────────
  # main 푸시(= dev → main 배포 PR 머지)에서 백엔드/앱 잡이 하나라도 실패하면 Slack 으로 통지한다.
  # PR 실행은 담당자가 PR 화면에서 바로 확인하므로 알림 대상에서 제외(소음 방지).
  notify:
    name: Slack 알림 (CI 실패)
    needs: [backend, app]
    if: failure() && github.event_name == 'push'
    runs-on: [self-hosted, Linux, X64, docker]
    steps:
      - uses: actions/checkout@v4

      - name: Slack CI 실패 알림
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REF: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          APP_RESULT: ${{ needs.app.result }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL 미설정 — Slack 알림 건너뜀"; exit 0
          fi
          # 커밋 메시지는 임의 문자열 → jq --arg 로 안전하게 JSON 이스케이프 (인젝션 차단)
          COMMIT_MSG="$(git log -1 --pretty=%s)"
          SHORT_SHA="$(git rev-parse --short HEAD)"
          PAYLOAD="$(jq -n \
            --arg head "❌ CI 실패 — $REPO ($REF)" \
            --arg fields "*저장소* \`$REPO\`"$'\n'"*커밋* \`$SHORT_SHA\` — $COMMIT_MSG"$'\n'"*푸시* $ACTOR"$'\n'"*백엔드* $BACKEND_RESULT · *앱* $APP_RESULT" \
            --arg run "$RUN_URL" \
            '{
              text: $head,
              blocks: [
                { type: "section", text: { type: "mrkdwn", text: ("*" + $head + "*") } },
                { type: "section", text: { type: "mrkdwn", text: $fields } },
                { type: "actions", elements: [
                  { type: "button", text: { type: "plain_text", text: "실행 로그 보기" }, url: $run }
                ]}
              ]
            }')"
          curl -sf -X POST -H 'Content-type: application/json' --data "$PAYLOAD" "$SLACK_WEBHOOK_URL" \
            && echo "Slack 알림 전송 완료" \
            || echo "Slack 알림 전송 실패"
